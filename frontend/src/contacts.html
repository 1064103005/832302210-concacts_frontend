<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通讯录管理系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <header>
        <h1>📞 通讯录管理系统</h1>
        <p class="subtitle">前后端分离架构 - 基于Spring Boot + MySQL</p>
    </header>

    <!-- 系统状态 -->
    <div class="status-bar">
        <div id="system-status" class="status-indicator">
            <span class="status-dot"></span>
            <span>系统状态: 检查中...</span>
        </div>
        <div class="contact-count">
            联系人总数: <span id="total-contacts">0</span>
        </div>
    </div>

    <!-- 添加/编辑联系人表单 -->
    <div class="form-section">
        <h2 id="form-title">
            <span class="form-icon">➕</span>
            <span id="form-title-text">添加联系人</span>
        </h2>
        <form id="contact-form">
            <input type="hidden" id="contact-id">
            <div class="form-grid">
                <div class="form-group">
                    <label for="name" class="required">姓名</label>
                    <input type="text" id="name" placeholder="请输入姓名" required>
                    <span class="error-message" id="name-error"></span>
                </div>
                <div class="form-group">
                    <label for="phone" class="required">电话号码</label>
                    <input type="tel" id="phone" placeholder="请输入手机号码" required>
                    <span class="error-message" id="phone-error"></span>
                </div>
                <div class="form-group">
                    <label for="email">电子邮箱</label>
                    <input type="email" id="email" placeholder="请输入邮箱地址">
                    <span class="error-message" id="email-error"></span>
                </div>
                <div class="form-group">
                    <label for="address">联系地址</label>
                    <input type="text" id="address" placeholder="请输入联系地址">
                </div>
            </div>
            <div class="form-buttons">
                <button type="submit" id="submit-btn" class="btn-primary">
                    <span class="btn-icon">✓</span>
                    <span id="submit-btn-text">添加联系人</span>
                </button>
                <button type="button" id="cancel-btn" class="btn-secondary" style="display: none;">
                    <span class="btn-icon">✕</span>
                    取消编辑
                </button>
            </div>
        </form>
    </div>

    <!-- 搜索和操作栏 -->
    <div class="action-bar">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="🔍 搜索联系人（姓名、电话、邮箱、地址）">
            <button id="clear-search" class="btn-clear">清除</button>
        </div>
        <div class="bulk-actions">
            <button id="refresh-btn" class="btn-refresh">
                <span class="btn-icon">🔄</span>
                刷新列表
            </button>
        </div>
    </div>

    <!-- 联系人列表 -->
    <div class="contacts-section">
        <h2>
            <span class="section-icon">👥</span>
            联系人列表
        </h2>
        <div id="contacts-list" class="contacts-list">
            <!-- 联系人列表将在这里动态生成 -->
        </div>
    </div>

    <!-- 加载指示器 -->
    <div id="loading-indicator" class="loading" style="display: none;">
        <div class="spinner"></div>
        <span>加载中...</span>
    </div>
</div>

<!-- 通知容器 -->
<div id="notification-container" class="notification-container"></div>

<script src="js/app.js"></script>
</body>
</html>
